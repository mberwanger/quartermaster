name: {{NAME_JSON}}
schema: meta/frontmatter.schema.json
packages: meta/packages.yaml

# Every markdown file is a document. Templates are excluded from the bundle
# because their ids are placeholders, but they are still validated here.
include: ["**/*.md"]
exclude: ["meta/templates/**"]

# What a document must be before a package may turn it into a rule. A draft is
# still distributed and still readable; it just never loads on its own.
#
# Any frontmatter field can be gated here, as an allowlist or a denylist:
#
#   domain: [engineering, platform]
#   owner: { not: [archived] }
#
# A restricted document is kept out of the bundle by Quartermaster itself,
# whatever this says, so it needs no line of its own.
requires:
  status: [stable]

# A document with type: skill is a skill, and type: agent an agent. A skill is a
# directory rather than a file, so the files beside it travel as its assets and
# need no frontmatter of their own.
#
# Declare skills: or agents: only to recognize a capability some other way, as a
# predicate over any frontmatter field:
#
#   skills:
#     type: [skill, playbook]
